<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ring Gallery</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="scene">
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="floor-glow"></div>

    <div class="preview" id="preview" hidden>
      <img class="preview__image" id="previewImage" alt="" />
      <p class="preview__title" id="previewTitle"></p>
    </div>

    <div class="stage" id="stage">
      <div class="float" id="floatEl">
        <div class="ring" id="ring">
          <div class="ring-spin" id="ringSpin"></div>
        </div>
      </div>
    </div>

    <p class="hint">Arrastrá para girar · clic en una tarjeta para ampliar</p>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" id="modalBackdrop"></div>
      <div class="marquee">
        <div class="marquee__bulbs marquee__bulbs--top" id="bulbsTop"></div>
        <div class="marquee__bulbs marquee__bulbs--bottom" id="bulbsBottom"></div>
        <div class="marquee__bulbs marquee__bulbs--left" id="bulbsLeft"></div>
        <div class="marquee__bulbs marquee__bulbs--right" id="bulbsRight"></div>
        <span class="bulb marquee__corner marquee__corner--tl"></span>
        <span class="bulb marquee__corner marquee__corner--tr"></span>
        <span class="bulb marquee__corner marquee__corner--bl"></span>
        <span class="bulb marquee__corner marquee__corner--br"></span>

        <div class="marquee__bezel">
          <span class="marquee__rivet marquee__rivet--tl"></span>
          <span class="marquee__rivet marquee__rivet--tr"></span>
          <span class="marquee__rivet marquee__rivet--bl"></span>
          <span class="marquee__rivet marquee__rivet--br"></span>

          <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <img class="modal__image" id="modalImage" alt="" />
            <div class="modal__body">
              <p class="modal__eyebrow" id="modalEyebrow"></p>
              <h2 class="modal__title" id="modalTitle"></h2>
              <p class="modal__desc" id="modalDesc"></p>
            </div>
            <button class="modal__close" id="modalClose" aria-label="Cerrar">&times;</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/ring-gallery.js"></script>
</body>
</html>
