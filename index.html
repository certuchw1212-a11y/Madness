<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ring Gallery</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="gallery">
    <div class="preview" id="preview" hidden>
      <img class="preview__image" id="previewImage" alt="" />
      <p class="preview__title" id="previewTitle"></p>
    </div>

    <div class="stage">
      <div class="ring" id="ring"></div>
    </div>
  </div>

  <script src="js/ring-gallery.js"></script>
</body>
</html>
